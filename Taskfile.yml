version: '3'

# Targets mship drives (mship test / build / run). Where the Makefile already
# owns a command, delegate to it rather than restating it here. `test` and
# `lint` have no Makefile target, so they mirror what CI runs in
# .github/workflows/test.yml.
tasks:
  test:
    desc: Run tests with the race detector (matches CI)
    cmds:
      - go test -race ./...

  lint:
    desc: Vet the tree (the only linter this repo uses)
    cmds:
      - go vet ./...

  build:
    desc: Build the binary to ./build/dotular
    cmds:
      - make build

  run:
    desc: Run the CLI (pass args with ARGS="...")
    cmds:
      - make run

  setup:
    desc: Download module dependencies
    cmds:
      - go mod download
